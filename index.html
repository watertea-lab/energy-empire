<!doctype html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Energy Empire</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    #app { width: 100%; height: 100%; }
    .globe-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .glow { text-shadow: 0 0 10px rgba(0,255,136,0.5); }
    .panel { backdrop-filter: blur(12px); background: rgba(10,20,30,0.85); border: 1px solid rgba(0,255,136,0.2); }
    @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .slide-up { animation: slideUp 0.6s ease forwards; }
    .safe-area { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); padding-top: env(safe-area-inset-top); }
    @media (max-width: 640px) {
      .panel { padding: 0.75rem; }
      header { min-height: 50px; }
    }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; display: flex; align-items: center; justify-content: center; }
    .modal-box { background: #0a141e; border: 1px solid rgba(0,255,136,0.4); border-radius: 12px; padding: 1.5rem; min-width: 280px; max-width: 90vw; color: #a7f3d0; }
    .modal-box input, .modal-box select {
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.3);
      color: #a7f3d0;
      border-radius: 6px;
      padding: 6px 10px;
      width: 100%;
      margin-top: 4px;
      font-size: 13px;
    }
    .modal-box label { font-size: 12px; color: #6ee7b7; display: block; margin-top: 10px; }
    .btn-green { background: rgba(0,255,136,0.15); border: 1px solid rgba(0,255,136,0.4); color: #00ff88; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 13px; transition: background 0.2s; }
    .btn-green:hover { background: rgba(0,255,136,0.3); }
    .btn-red { background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.4); color: #f87171; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 13px; }
    .btn-gray { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #9ca3af; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 13px; }
    /* Portfolio table */
    .portfolio-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(0,255,136,0.08); font-size: 12px; gap: 4px; }
    .portfolio-row:last-child { border-bottom: none; }
    /* API status dot */
    .api-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .api-dot.ok { background: #00ff88; }
    .api-dot.fail { background: #f87171; }
    .api-dot.loading { background: #fbbf24; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  </style>
</head>
<body class="h-full w-full overflow-hidden" style="background: #0a0e1a; font-family: 'Noto Sans TC', sans-serif;">
<div id="app" class="h-full w-full relative flex flex-col">

  <!-- Header -->

  <!-- Main -->

    <!-- Bottom Panel -->

<script>
// ═══════════════════════════════════════════════
// 金鑰已移到後端（Azure 環境變數 FINNHUB_KEY）
// 前端只打同源的 /api/quote，原始碼裡不再有任何 key
// ═══════════════════════════════════════════════

// ─── Game State ───────────────────────────────────────────────
const state = {
  turn: 1,
  cash: 10000000,
  energyInvested: 0,
  mode: 'game',            // 'game' 遊戲展示 ｜ 'invest' 模擬股票投資
  investStart: null,       // 投資模式起始時間（ms）
  energy: { solar: 15, oil: 35, coal: 25, nuclear: 15, wind: 10 },
  stocks: [
    { ticker: 'XOM',    name: 'ExxonMobil', price: 105, type: 'oil',     real: true, src: 'finnhub', cur: '$',  curCode: 'USD' },
    { ticker: 'NEE',    name: 'NextEra',    price: 75,  type: 'solar',   real: true, src: 'finnhub', cur: '$',  curCode: 'USD' },
    { ticker: 'ORSTED', name: 'Ørsted',     price: 50,  type: 'wind',    real: true, src: 'yahoo', ysym: 'ORSTED.CO', cur: 'kr', curCode: 'DKK' },
    { ticker: 'CCJ',    name: 'Cameco',     price: 42,  type: 'nuclear', real: true, src: 'finnhub', cur: '$',  curCode: 'USD' },
    { ticker: '601857', name: '中國石油',   price: 12,  type: 'oil',     real: true, src: 'yahoo', ysym: '601857.SS', cur: '¥', curCode: 'CNY' },
    { ticker: '600688', name: '上海石化',   price: 8.5, type: 'oil',     real: true, src: 'yahoo', ysym: '600688.SS', cur: '¥', curCode: 'CNY' },
    { ticker: '600905', name: '三峽能源',   price: 28,  type: 'wind',    real: true, src: 'yahoo', ysym: '600905.SS', cur: '¥', curCode: 'CNY' },
    { ticker: '300750', name: '寧德時代',   price: 180, type: 'solar',   real: true, src: 'yahoo', ysym: '300750.SZ', cur: '¥', curCode: 'CNY' }
  ],
  // CRUD: 持倉紀錄 { ticker, name, qty, avgCost }
  portfolio: [],
  countries: [
    { name: '台灣',   lat: 23.5, lon: 121,  economy: 100, solar: 15, coal: 30, nuclear: 20 },
    { name: 'USA',    lat: 38,   lon: -97,   economy: 500, solar: 25, oil: 40, gas: 35 },
    { name: '德國',   lat: 51,   lon: 10,    economy: 300, wind: 35, solar: 20, coal: 25 },
    { name: '沙烏地', lat: 24,   lon: 45,    economy: 250, oil: 80, solar: 10 },
    { name: '日本',   lat: 36,   lon: 138,   economy: 350, nuclear: 20, solar: 15, coal: 30 },
    { name: '中國',   lat: 35,   lon: 105,   economy: 600, coal: 50, solar: 15, wind: 10 }
  ],
  randomEvents: [
    { name: '中東衝突爆發',   effect: 'oil',    delta: +8 },
    { name: '颱風侵襲',       effect: 'solar',  delta: -5 },
    { name: '再生能源補助通過', effect: 'solar', delta: +5 },
    { name: '核電廠事故',     effect: 'nuclear', delta: -8 },
    { name: '碳稅加重',       effect: 'coal',   delta: -6 },
    { name: '風電技術突破',   effect: 'wind',   delta: +6 }
  ],
  log: [],
  apiStatus: 'loading' // 'loading' | 'ok' | 'fail'
};

// ─── API Fetch 工具函式 ───────────────────────────────────────
// 多個 CORS Proxy，依序嘗試
const PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://thingproxy.freeboard.io/fetch/${url}`
];

async function fetchViaProxy(url, timeout = 8000) {
  for (const makeProxy of PROXIES) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    try {
      const res = await fetch(makeProxy(url), { signal: controller.signal });
      clearTimeout(id);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (text.includes('Host not in allowlist') || text.trim() === '') throw new Error('blocked');
      return JSON.parse(text);
    } catch (e) {
      clearTimeout(id);
      // 這個 proxy 失敗，試下一個
    }
  }
  throw new Error('所有 Proxy 均失敗');
}

async function fetchDirect(url, timeout = 8000) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  try {
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(id);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (e) {
    clearTimeout(id);
    throw e;
  }
}

// 匯率：open.er-api.com 免費、免 key、原生支援 CORS。以 USD 為基準。
async function fetchFxRates() {
  try {
    const data = await fetchDirect('https://open.er-api.com/v6/latest/USD');
    if (data && data.rates && data.rates.TWD) {
      state.fxRates = data.rates;   // rates.TWD / rates.DKK / rates.CNY = 每 1 USD = ? 該幣別
      addLog('✓ 匯率已更新');
      return true;
    }
  } catch (e) {
    addLog('⚠ 匯率取得失敗');
  }
  return false;
}

// 把某幣別價格換算成台幣：TWD/該幣 = (TWD per USD) / (該幣 per USD)
function toTWD(price, curCode) {
  const r = state.fxRates;
  if (!r || !r.TWD || !r[curCode]) return null;
  return price * (r.TWD / r[curCode]);
}

// ─── 台幣經濟相關 ─────────────────────────────────────────────
const START_CAPITAL = 10000000;                      // 起始資金 NT$10,000,000
const RENEWABLE_BONUS = 600000;                      // 再生能源每回合收入加成係數（再生占比 × 此值）
function stockTWD(s) { return toTWD(s.price, s.curCode); }   // 該股現價(台幣/股)
function fmtNT(n) { return 'NT$' + Math.round(n).toLocaleString(); }

// 總資產淨值 = 現金 + 所有持股的台幣市值
function netWorth() {
  let holdings = 0;
  for (const p of state.portfolio) {
    const s = state.stocks.find(x => x.ticker === p.ticker);
    const tw = s ? stockTWD(s) : null;
    holdings += (tw != null ? tw : p.avgCost) * p.qty;   // avgCost 已是台幣
  }
  return state.cash + holdings;
}

// 結算：彈出總結畫面
function settle() {
  const nw = netWorth();
  const ret = (nw - START_CAPITAL) / START_CAPITAL * 100;
  let best = null, worst = null;
  for (const p of state.portfolio) {
    const s = state.stocks.find(x => x.ticker === p.ticker);
    const tw = s ? stockTWD(s) : p.avgCost;
    const pct = (tw - p.avgCost) / p.avgCost * 100;
    if (best === null || pct > best.pct) best = { ticker: p.ticker, pct };
    if (worst === null || pct < worst.pct) worst = { ticker: p.ticker, pct };
  }
  let rank;
  if (ret >= 30) rank = '🏆 能源大亨';
  else if (ret >= 10) rank = '🌟 精明投資人';
  else if (ret >= 0) rank = '🙂 穩健保本';
  else if (ret >= -15) rank = '😐 小幅虧損';
  else rank = '💸 再接再厲';

  const fmtPct = v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
  let html = '';
  html += `<div class="text-emerald-400/70">${state.mode === 'invest' ? '模擬股票投資結算' : '第 ' + state.turn + ' 回合結算'}</div>`;
  html += `<div style="height:6px"></div>`;
  html += `<div>起始資金：${fmtNT(START_CAPITAL)}</div>`;
  html += `<div>現金：${fmtNT(state.cash)}</div>`;
  html += `<div>持股市值：${fmtNT(nw - state.cash)}</div>`;
  html += `<div class="font-bold text-emerald-300">總資產淨值：${fmtNT(nw)}</div>`;
  html += `<div style="height:6px"></div>`;
  html += `<div class="font-bold ${ret>=0?'text-emerald-400':'text-red-400'}">總報酬率：${fmtPct(ret)}</div>`;
  if (best) html += `<div>最賺持股：${best.ticker} (${fmtPct(best.pct)})</div>`;
  if (worst && state.portfolio.length > 1) html += `<div>最賠持股：${worst.ticker} (${fmtPct(worst.pct)})</div>`;
  html += `<div style="height:6px"></div>`;
  html += `<div class="text-base font-bold">評等：${rank}</div>`;

  document.getElementById('settle-content').innerHTML = html;
  document.getElementById('settle-modal').classList.remove('hidden');
}

// ① Open-Meteo 太陽輻射 + 風速（台灣台北，完全免費無需 key，原生支援 CORS）
async function fetchTaiwanPower() {
  try {
    // Open-Meteo：台灣當前太陽輻射(W/m²) & 風速(km/h)
    const data = await fetchDirect(
      'https://api.open-meteo.com/v1/forecast?latitude=25.04&longitude=121.53&current=shortwave_radiation,wind_speed_10m,temperature_2m&timezone=Asia%2FTaipei'
    );
    if (data?.current) {
      const radiation = data.current.shortwave_radiation ?? 0;  // W/m²
      const windSpeed = data.current.wind_speed_10m ?? 0;        // km/h
      const temp      = data.current.temperature_2m ?? 0;

      // 轉換成遊戲用數字（模擬發電量）
      const solarEst = Math.round(radiation * 0.15); // 粗估 MW（依輻射）
      const windEst  = Math.round(windSpeed * 12);   // 粗估 MW（依風速）

      setDashboard('rt-solar', `☀️ ${radiation} W/m²（約${solarEst}MW）`);
      setDashboard('rt-power', `🌡️ ${temp}°C 風${windSpeed}km/h`);

      // 更新遊戲能源佔比
      if (radiation > 300) state.energy.solar = Math.min(40, state.energy.solar + 1);
      if (windSpeed > 20)  state.energy.wind  = Math.min(30, state.energy.wind + 1);

      addLog(`✓ 台灣即時天氣：太陽輻射${radiation}W/m²，風速${windSpeed}km/h`);
      return true;
    }
  } catch (e) {
    setDashboard('rt-solar', '無法連線 --', false);
    setDashboard('rt-power', '無法連線 --', false);
    addLog('⚠ Open-Meteo API 暫時無法連線');
  }
  return false;
}

// ⑤ Finnhub 真實美股股價
// 抓單一支報價：先試主要來源，Finnhub 失敗時自動改用 Yahoo 後備（同代號美股）
async function fetchQuote(stock) {
  const primary = stock.src === 'yahoo'
    ? `/api/quote-intl?symbol=${encodeURIComponent(stock.ysym)}`
    : `/api/quote?symbol=${encodeURIComponent(stock.ticker)}`;

  // 1) 主要來源
  try {
    const data = await fetchDirect(primary);
    if (data && typeof data.c === 'number' && data.c > 0) return { data, via: 'primary' };
  } catch (e) { /* 落到後備 */ }

  // 2) 後備：Finnhub 來源失敗時，改用 Yahoo 抓同一支（美股代號相同、同為美元）
  if (stock.src !== 'yahoo') {
    try {
      const data = await fetchDirect(`/api/quote-intl?symbol=${encodeURIComponent(stock.ticker)}`);
      if (data && typeof data.c === 'number' && data.c > 0) return { data, via: 'fallback' };
    } catch (e) { /* 主來源與後備皆失敗 */ }
  }
  return null;
}

async function fetchRealStocks() {
  const realStocks = state.stocks.filter(s => s.real);
  let successCount = 0;
  for (const stock of realStocks) {
    const result = await fetchQuote(stock);
    if (result) {
      const data = result.data;
      stock.price     = parseFloat(data.c.toFixed(2));
      stock.prevClose = data.pc || stock.price;
      const change = data.pc ? ((data.c - data.pc) / data.pc * 100).toFixed(2) : '0.00';
      const tag = result.via === 'fallback' ? ' [Yahoo備援]' : '';
      addLog(`✓ ${stock.ticker}: $${stock.price} (${parseFloat(change) >= 0 ? '+' : ''}${change}%)${tag}`);
      successCount++;
    } else {
      addLog(`⚠ ${stock.ticker} 股價取得失敗（主來源與後備皆無回應）`);
    }
    await new Promise(r => setTimeout(r, 300));
  }
  // 無論成功幾支都強制更新畫面
  render();
  if (successCount > 0) {
    addLog(`✓ 真實股價已更新 ${successCount}/${realStocks.length} 支`);
    return true;
  }
  return false;
}
async function initAPIs() {
  updateApiDot('loading');

  const results = await Promise.allSettled([
    fetchTaiwanPower(),
    fetchOilPrice(),
    fetchAQI(),
    fetchFxRates()
  ]);

}

function updateBuyCost() {
  const ticker = document.getElementById('buy-ticker').value;
  const qty = parseInt(document.getElementById('buy-qty').value) || 0;
  const stock = state.stocks.find(s => s.ticker === ticker);
  if (stock) {
    const tw = stockTWD(stock);
    if (tw == null) {
      document.getElementById('buy-cost').textContent = '匯率載入中,請稍候…';
      return;
    }
    const cost = tw * qty;
    document.getElementById('buy-cost').textContent =
      `預計花費：${fmtNT(cost)}　(現金：${fmtNT(state.cash)})`;
  }
}
document.getElementById('buy-ticker').addEventListener('change', updateBuyCost);
document.getElementById('buy-qty').addEventListener('input', updateBuyCost);

function confirmBuy() {
  const ticker = document.getElementById('buy-ticker').value;
  const qty = parseInt(document.getElementById('buy-qty').value) || 0;
  if (qty <= 0) return alert('請輸入有效數量');
  const stock = state.stocks.find(s => s.ticker === ticker);
  const priceTw = stockTWD(stock);
  if (priceTw == null) return alert('匯率尚未載入,請稍候再試');
  const cost = priceTw * qty;
  if (cost > state.cash) return alert('資金不足！');

  state.cash = Math.round(state.cash - cost);
  // 找既有持倉或新增（avgCost 以台幣計）
  let holding = state.portfolio.find(p => p.ticker === ticker);
  if (holding) {
    // UPDATE avgCost
    const totalCost = holding.avgCost * holding.qty + priceTw * qty;
    holding.qty += qty;
    holding.avgCost = totalCost / holding.qty;
  } else {
    // CREATE
    state.portfolio.push({ ticker, name: stock.name, qty, avgCost: priceTw });
  }
  addLog(`買入 ${ticker} x${qty} @${fmtNT(priceTw)} (-${fmtNT(cost)})`);
  closeModal('buy-modal');
  render();
}

// READ：顯示持倉（renderPortfolio 中處理）

// UPDATE + DELETE：賣出
function openSellModal() {
  if (state.portfolio.length === 0) return alert('你目前沒有持倉！');
  const sel = document.getElementById('sell-ticker');
  sel.innerHTML = state.portfolio.map(p => {
    const stock = state.stocks.find(s => s.ticker === p.ticker);
    const tw = stock ? stockTWD(stock) : null;
    const currentPrice = (tw != null) ? tw : p.avgCost;
    const pnl = ((currentPrice - p.avgCost) / p.avgCost * 100).toFixed(1);
    return `<option value="${p.ticker}">${p.ticker} x${p.qty} (${pnl >= 0 ? '+' : ''}${pnl}%)</option>`;
  }).join('');
  document.getElementById('sell-qty').value = 1;
  updateSellInfo();
  document.getElementById('sell-modal').classList.remove('hidden');
}

function updateSellInfo() {
  const ticker = document.getElementById('sell-ticker').value;
  const qty = parseInt(document.getElementById('sell-qty').value) || 0;
  const holding = state.portfolio.find(p => p.ticker === ticker);
  const stock = state.stocks.find(s => s.ticker === ticker);
  if (holding && stock) {
    const tw = stockTWD(stock);
    const cur = (tw != null) ? tw : holding.avgCost;
    const revenue = cur * qty;
    const pnl = (cur - holding.avgCost) * qty;
    document.getElementById('sell-info').textContent =
      `持有：${holding.qty}股　預計收回：${fmtNT(revenue)}　損益：${pnl >= 0 ? '+' : ''}${fmtNT(pnl)}`;
  }
}
document.getElementById('sell-ticker').addEventListener('change', updateSellInfo);
document.getElementById('sell-qty').addEventListener('input', updateSellInfo);

function confirmSell() {
  const ticker = document.getElementById('sell-ticker').value;
  const qty = parseInt(document.getElementById('sell-qty').value) || 0;
  if (qty <= 0) return alert('請輸入有效數量');
  const holding = state.portfolio.find(p => p.ticker === ticker);
  if (!holding) return alert('找不到持倉');
  if (qty > holding.qty) return alert(`持有數量不足（僅有 ${holding.qty} 股）`);

  const stock = state.stocks.find(s => s.ticker === ticker);
  const cur = stockTWD(stock);
  const px = (cur != null) ? cur : holding.avgCost;
  const revenue = px * qty;
  const pnl = (px - holding.avgCost) * qty;
  state.cash = Math.round(state.cash + revenue);

  if (qty === holding.qty) {
    // DELETE：全部賣出，移除持倉
    state.portfolio = state.portfolio.filter(p => p.ticker !== ticker);
  } else {
    // UPDATE：部分賣出
    holding.qty -= qty;
  }
  addLog(`賣出 ${ticker} x${qty} @${fmtNT(px)} (+${fmtNT(revenue)}, 損益:${pnl >= 0 ? '+' : ''}${fmtNT(pnl)})`);
  closeModal('sell-modal');
  render();
}

  const retEl = document.getElementById('net-return');

    retEl.textContent = `${ret >= 0 ? '+' : ''}${ret.toFixed(1)}%`;
    retEl.className = ret >= 0 ? 'text-emerald-400' : 'text-red-400';
  }
}

function addLog(msg) {
  const tag = state.mode === 'invest'
    ? new Date().toLocaleTimeString('zh-TW', { hour12: false, timeZone: 'Asia/Taipei' })  // 投資模式：台北時間
    : `回合${state.turn}`;                                                                  // 遊戲模式：回合
  state.log.push(`[${tag}] ${msg}`);
}

// ─── 雙模式 + 各自獨立存檔（localStorage 持久化）─────────────
const SAVE_KEYS = { game: 'energyEmpireSave_game_v1', invest: 'energyEmpireSave_invest_v1' };
const MODE_KEY = 'energyEmpireMode';
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEYS[state.mode], JSON.stringify({
      turn: state.turn, cash: state.cash, energyInvested: state.energyInvested,
      energy: state.energy, portfolio: state.portfolio, investStart: state.investStart
    }));
  } catch (e) { /* 無痕模式或容量限制時略過 */ }
}
function loadGame(mode) {
  try {
    const raw = localStorage.getItem(SAVE_KEYS[mode]);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (typeof s.cash === 'number') state.cash = s.cash;
    if (typeof s.turn === 'number') state.turn = s.turn;
    if (typeof s.energyInvested === 'number') state.energyInvested = s.energyInvested;
    if (s.energy) state.energy = s.energy;
    if (Array.isArray(s.portfolio)) state.portfolio = s.portfolio;
    if (typeof s.investStart === 'number') state.investStart = s.investStart;
    return true;
  } catch (e) { return false; }
}
// 投資模式乾淨起始：固定 NT$1000萬、從當下起算
function freshInvest() {
  state.cash = START_CAPITAL; state.energyInvested = 0;
  state.portfolio = []; state.turn = 1; state.investStart = Date.now();
}
function resetGame() {
  const msg = state.mode === 'invest'
    ? '確定要開始一段新的模擬股票投資嗎？將以 NT$10,000,000、從現在重新計時。'
    : '確定要重新開始嗎？目前的資金、持倉與回合將被清除。';
  if (!confirm(msg)) return;
  try { localStorage.removeItem(SAVE_KEYS[state.mode]); } catch (e) {}
  location.reload();
}
function switchMode(mode) {
  if (mode === state.mode) return;
  saveGame();                                  // 先存好目前模式
  try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
  location.reload();                           // 重新載入 → 依模式載入對應存檔
}
function modeBtnClass(active) {
  return 'flex-1 rounded px-2 py-1.5 text-xs sm:text-sm transition ' +
    (active ? 'bg-emerald-500/30 border border-emerald-400/60 text-emerald-200 font-bold'
            : 'bg-slate-700/30 border border-slate-600/40 text-slate-400 hover:bg-slate-700/50');
}
function applyModeUI() {
  const invest = state.mode === 'invest';
  document.querySelectorAll('.game-only').forEach(el => el.classList.toggle('hidden', invest));
  document.querySelectorAll('.invest-only').forEach(el => el.classList.toggle('hidden', !invest));
  const gBtn = document.getElementById('mode-game'), iBtn = document.getElementById('mode-invest');
  if (gBtn && iBtn) { gBtn.className = modeBtnClass(!invest); iBtn.className = modeBtnClass(invest); }
}
function updateInvestInfo() {
  const el = document.getElementById('invest-info');
  if (!el) return;
  const nw = netWorth();
  const ret = (nw - START_CAPITAL) / START_CAPITAL * 100;
  const startTxt = state.investStart ? new Date(state.investStart).toLocaleString('zh-TW', { hour12: false }) : '—';
  el.innerHTML = `起始 ${startTxt}　|　淨值 ${fmtNT(nw)}　|　` +
    `<span class="${ret >= 0 ? 'text-emerald-400' : 'text-red-400'} font-bold">報酬率 ${(ret >= 0 ? '+' : '') + ret.toFixed(2)}%</span>`;
}
async function refreshQuotes() { await fetchRealStocks(); render(); }

function render() {
  renderMarket();
  renderStocks();
  renderPortfolio();
  renderLog();
  updateHUD();
  if (state.mode === 'invest') updateInvestInfo();
  saveGame();   // 每次畫面更新後自動存檔
}

// ─── Game Actions ─────────────────────────────────────────────
function invest(type) {
  if (state.cash < 300000) { alert('資金不足！至少需要 NT$300,000'); return; }
  state.cash -= 300000;
  state.energyInvested += 300000;
  state.energy[type] = Math.min(60, (state.energy[type] || 0) + 8);
  // 重新正規化，保持總和 100
  const total = Object.values(state.energy).reduce((a,b) => a+b, 0);
  Object.keys(state.energy).forEach(k => state.energy[k] = Math.max(1, Math.round(state.energy[k] / total * 100)));
  addLog(`投資 ${type} 能源 (-NT$300,000，佔比+8%)`);
  render();
}

function nextTurn() {
  if (state.mode === 'invest') return;   // 投資模式無回合
  state.turn++;
  // 收入：根據再生能源佔比浮動
  const renewableRatio = (state.energy.solar + state.energy.wind) / 100;
  const income = Math.round(120000 + renewableRatio * RENEWABLE_BONUS + Math.random() * 80000);
  state.cash += income;
  addLog(`回合收入 +${fmtNT(income)}`);

  // 股價隨機波動
  state.stocks.forEach(s => {
    s.price = Math.max(1, s.price * (0.93 + Math.random() * 0.16));
  });

  // 隨機事件（40% 機率）
  if (Math.random() > 0.6) {
    const ev = state.randomEvents[Math.floor(Math.random() * state.randomEvents.length)];
    if (state.energy[ev.effect] !== undefined) {
      state.energy[ev.effect] = Math.max(1, Math.min(70, state.energy[ev.effect] + ev.delta));
    }
    addLog(`[事件] ${ev.name}`);
  }

  render();
}

// ─── 3D Globe ─────────────────────────────────────────────────
const canvas = document.getElementById('globe');
const ctx = canvas.getContext('2d', { alpha: true });

function resizeCanvas() {
  const parent = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = parent.clientWidth  * dpr;
  canvas.height = parent.clientHeight * dpr;
  ctx.scale(dpr, dpr);
}

let rotX = 0.3, rotY = 0, dragging = false, lastX = 0, lastY = 0, autoRotate = true;

canvas.addEventListener('mousedown', e => { dragging = true; autoRotate = false; lastX = e.clientX; lastY = e.clientY; });
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  rotY += (e.clientX - lastX) * 0.005;
  rotX  = Math.max(-1.5, Math.min(1.5, rotX + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('mouseup',    () => { dragging = false; setTimeout(() => autoRotate = true, 3000); });
canvas.addEventListener('mouseleave', () => { dragging = false; });
canvas.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  dragging = true; autoRotate = false;
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (!dragging || e.touches.length !== 1) return;
  rotY += (e.touches[0].clientX - lastX) * 0.008;
  rotX  = Math.max(-1.5, Math.min(1.5, rotX + (e.touches[0].clientY - lastY) * 0.008));
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchend', () => { dragging = false; setTimeout(() => autoRotate = true, 3000); }, { passive: true });

function project(lat, lon) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  const R = 200;
  let x = R * Math.sin(phi) * Math.cos(theta);
  let y = R * Math.cos(phi);
  let z = R * Math.sin(phi) * Math.sin(theta);
  let x2 = x * Math.cos(rotY) - z * Math.sin(rotY);
  let z2 = x * Math.sin(rotY) + z * Math.cos(rotY);
  let y2 = y * Math.cos(rotX) - z2 * Math.sin(rotX);
  let z3 = y * Math.sin(rotX) + z2 * Math.cos(rotX);
  return { x: x2, y: y2, z: z3 };
}

const continents = [
  [[70,-170],[72,-130],[65,-90],[50,-60],[30,-80],[25,-100],[30,-120],[50,-130],[60,-150],[70,-170]],
  [[10,-75],[5,-35],[-10,-35],[-35,-55],[-55,-70],[-40,-65],[-20,-40],[0,-50],[10,-75]],
  [[35,-10],[40,0],[45,10],[50,5],[55,10],[60,25],[70,30],[65,50],[55,40],[45,30],[40,25],[35,25],[35,-10]],
  [[35,-10],[35,35],[20,40],[10,45],[0,40],[-15,40],[-35,20],[-35,18],[-5,10],[5,-5],[15,-15],[35,-10]],
  [[65,50],[70,140],[60,160],[50,140],[35,130],[20,110],[10,105],[5,100],[10,80],[25,65],[35,50],[45,50],[55,70],[65,50]],
  [[-15,130],[-10,150],[-25,153],[-35,150],[-38,145],[-35,115],[-20,115],[-15,130]]
];

function drawGlobe() {
  const W = canvas.width / (window.devicePixelRatio || 1);
  const H = canvas.height / (window.devicePixelRatio || 1);
  if (!W || !H) { requestAnimationFrame(drawGlobe); return; }
  const cx = W/2, cy = H/2;

  ctx.clearRect(0, 0, W, H);

  // Glow backdrop
  const grd = ctx.createRadialGradient(cx, cy, 180, cx, cy, 260);
  grd.addColorStop(0, 'rgba(0,255,136,0.05)');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // Ocean
  ctx.beginPath();
  ctx.arc(cx, cy, 200, 0, Math.PI*2);
  ctx.fillStyle = '#0a2540';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,255,136,0.3)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Grid
  ctx.strokeStyle = 'rgba(0,255,136,0.08)';
  ctx.lineWidth = 0.5;
  for (let lat = -60; lat <= 60; lat += 30) {
    ctx.beginPath();
    for (let lon = 0; lon <= 360; lon += 5) {
      const p = project(lat, lon - 180);
      if (p.z > 0) ctx.lineTo(cx+p.x, cy-p.y);
      else ctx.moveTo(cx+p.x, cy-p.y);
    }
    ctx.stroke();
  }
  for (let lon = -180; lon < 180; lon += 30) {
    ctx.beginPath();
    for (let lat = -90; lat <= 90; lat += 5) {
      const p = project(lat, lon);
      if (p.z > 0) ctx.lineTo(cx+p.x, cy-p.y);
      else ctx.moveTo(cx+p.x, cy-p.y);
    }
    ctx.stroke();
  }

  // Continents
  ctx.strokeStyle = 'rgba(0,255,136,0.6)';
  ctx.fillStyle = 'rgba(0,255,136,0.12)';
  ctx.lineWidth = 1.2;
  continents.forEach(cont => {
    ctx.beginPath();
    let started = false;
    cont.forEach(([lat, lon]) => {
      const p = project(lat, lon);
      if (p.z > 0) {
        if (!started) { ctx.moveTo(cx+p.x, cy-p.y); started = true; }
        else ctx.lineTo(cx+p.x, cy-p.y);
      } else { started = false; }
    });
    ctx.fill();
    ctx.stroke();
  });

  // Country dots
  state.countries.forEach(c => {
    const p = project(c.lat, c.lon);
    if (p.z > 0) {
      ctx.beginPath();
      ctx.arc(cx+p.x, cy-p.y, 5, 0, Math.PI*2);
      ctx.fillStyle = '#00ff88';
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '10px "Noto Sans TC"';
      ctx.fillText(c.name, cx+p.x+8, cy-p.y+4);
    }
  });

  if (autoRotate) rotY -= 0.001;
  requestAnimationFrame(drawGlobe);
}

// Country click
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const mx = (e.clientX - rect.left) * dpr;
  const my = (e.clientY - rect.top)  * dpr;
  const W = canvas.width / dpr, H = canvas.height / dpr;
  const cx = W/2, cy = H/2;
  let found = null;
  state.countries.forEach(c => {
    const p = project(c.lat, c.lon);
    if (p.z > 0) {
      const dx = (cx+p.x)*dpr - mx, dy = (cy-p.y)*dpr - my;
      if (Math.sqrt(dx*dx+dy*dy) < 20) found = c;
    }
  });
  const info = document.getElementById('country-info');
  if (found) {
    document.getElementById('ci-name').textContent = found.name;
    document.getElementById('ci-details').innerHTML = `
      <div>經濟規模: ${found.economy}</div>
      ${found.solar   ? `<div>☀️ 太陽: ${found.solar}%</div>`   : ''}
      ${found.oil     ? `<div>🛢️ 石油: ${found.oil}%</div>`     : ''}
      ${found.coal    ? `<div>⚫ 煤: ${found.coal}%</div>`       : ''}
      ${found.nuclear ? `<div>⚛️ 核能: ${found.nuclear}%</div>` : ''}
      ${found.wind    ? `<div>💨 風能: ${found.wind}%</div>`     : ''}
      ${found.gas     ? `<div>🔥 天然氣: ${found.gas}%</div>`   : ''}
    `;
    info.classList.remove('hidden');
  } else {
    info.classList.add('hidden');
  }
});

// ─── Init ────────────────────────────────────────────────────
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));
// 依上次選擇的模式載入對應存檔（兩模式各自獨立）
try { state.mode = (localStorage.getItem(MODE_KEY) === 'invest') ? 'invest' : 'game'; } catch (e) {}
if (!loadGame(state.mode) && state.mode === 'invest') freshInvest();  // 投資模式無存檔 → 乾淨起始
applyModeUI();
render();
drawGlobe();
lucide.createIcons();
initAPIs();

// ═══════════════════════════════════════════════
// 背景音樂：兩首輪流播放 + 自動開始 + 音量/播停控制（純 <audio>，最穩）
// 兩首檔名：bgm.mp3、bgm2.mp3（一首播完自動換下一首；只放一首也能用）
// 因瀏覽器政策，無法「載入即出聲」→ 第一次互動（點/觸/按鍵）時自動開始
// ═══════════════════════════════════════════════
(function () {
  const PLAYLIST = ['bgm.mp3', 'bgm2.mp3'];   // 想只用一首：改成 ['bgm.mp3']
  const audio = document.getElementById('bgm');
  let idx = 0;
  const volEl = document.getElementById('music-vol');
  audio.volume = volEl ? (parseFloat(volEl.value) || 1) : 1;

  function setIcon(playing) {
    const b = document.getElementById('music-toggle');
    if (b) b.textContent = playing ? '⏸️' : '▶️';
  }
  function playTrack(i) {
    idx = ((i % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
    audio.src = PLAYLIST[idx];
    audio.play().then(() => setIcon(true))
                .catch((e) => console.warn('[音樂] 播放失敗，請確認 ' + PLAYLIST[idx] + ' 是否存在：', e));
  }
  audio.addEventListener('ended', () => playTrack(idx + 1));   // 一首播完換下一首
  audio.addEventListener('error', () => console.warn('[音樂] 檔案載入失敗：', audio.src));

  window.musicToggle = function () {
    if (audio.paused) {
      if (!audio.src) playTrack(0);
      else audio.play().then(() => setIcon(true)).catch(() => {});
    } else { audio.pause(); setIcon(false); }
  };
  window.musicVolume = function (v) {
    audio.volume = Math.max(0, Math.min(1, parseFloat(v)));   // <audio> 音量 0~1
  };

  // 不自動播放：完全由使用者點右下角 ▶️ 控制鈕才開始（尊重使用者選擇、符合現代瀏覽器政策）
})();
</script>

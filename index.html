<!doctype html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Energy Empire</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    #app { width: 100%; height: 100%; }
    .globe-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .glow { text-shadow: 0 0 10px rgba(0,255,136,0.5); }
    .panel { backdrop-filter: blur(12px); background: rgba(10,20,30,0.85); border: 1px solid rgba(0,255,136,0.2); }
    @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .slide-up { animation: slideUp 0.6s ease forwards; }
    .safe-area { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); padding-top: env(safe-area-inset-top); }
    @media (max-width: 640px) {
      .panel { padding: 0.75rem; }

    }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; display: flex; align-items: center; justify-content: center; }
    .modal-box { background: #0a141e; border: 1px solid rgba(0,255,136,0.4); border-radius: 12px; padding: 1.5rem; min-width: 280px; max-width: 90vw; color: #a7f3d0; }
    .modal-box input, .modal-box select {
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.3);
      color: #a7f3d0;
      border-radius: 6px;
      padding: 6px 10px;
      width: 100%;
      margin-top: 4px;
      font-size: 13px;
    }
    .modal-box label { font-size: 12px; color: #6ee7b7; display: block; margin-top: 10px; }
    .btn-green { background: rgba(0,255,136,0.15); border: 1px solid rgba(0,255,136,0.4); color: #00ff88; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 13px; transition: background 0.2s; }
    .btn-green:hover { background: rgba(0,255,136,0.3); }
    .btn-red { background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.4); color: #f87171; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 13px; }
    .btn-gray { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #9ca3af; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 13px; }
    /* Portfolio table */

    .portfolio-row:last-child { border-bottom: none; }
    /* API status dot */
    .api-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .api-dot.ok { background: #00ff88; }
    .api-dot.fail { background: #f87171; }
    .api-dot.loading { background: #fbbf24; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  </style>
</head>
<body class="h-full w-full overflow-hidden" style="background: #0a0e1a; font-family: 'Noto Sans TC', sans-serif;">

          </div>
          <div class="bg-gray-900/20 rounded p-1.5 border border-gray-700/30">
            <div class="text-gray-400 text-xs mb-0.5">💨 台灣AQI</div>

          <button onclick="invest('nuclear')" class="bg-purple-600/30 border border-purple-500/50 text-purple-300 rounded px-2 py-1.5 hover:bg-purple-600/50 transition active:scale-95">⚛️ 核能 -$500M</button>
          <button onclick="invest('wind')" class="bg-cyan-600/30 border border-cyan-500/50 text-cyan-300 rounded px-2 py-1.5 hover:bg-cyan-600/50 transition active:scale-95">💨 風能 -$500M</button>
          <button onclick="openBuyModal()" class="bg-emerald-600/30 border border-emerald-500/50 text-emerald-300 rounded px-2 py-1.5 hover:bg-emerald-600/50 transition active:scale-95">📈 買股票</button>
          <button onclick="openSellModal()" class="bg-orange-600/30 border border-orange-500/50 text-orange-300 rounded px-2 py-1.5 hover:bg-orange-600/50 transition active:scale-95">📉 賣股票</button>
          <button onclick="nextTurn()" class="bg-red-600/30 border border-red-500/50 text-red-300 rounded px-2 py-1.5 hover:bg-red-600/50 transition active:scale-95 col-span-2">⏭️ 下一回合</button>

</div>

<!-- Buy Modal -->

  <div class="modal-box">
    <h3 class="text-emerald-400 font-bold mb-3" style="font-family:'Orbitron',monospace;">📈 買入股票</h3>

  <div class="modal-box">
    <h3 class="text-emerald-400 font-bold mb-3" style="font-family:'Orbitron',monospace;">📉 賣出股票</h3>
    <label>選擇持倉</label>
    <select id="sell-ticker"></select>
    <label>數量（股）</label>
    <input type="number" id="sell-qty" min="1" value="1" placeholder="輸入數量">
    <div id="sell-info" class="text-xs mt-2 text-emerald-300/70"></div>
    <div class="flex gap-2 mt-4">
      <button class="btn-red" onclick="confirmSell()">確認賣出</button>
      <button class="btn-gray" onclick="closeModal('sell-modal')">取消</button>
    </div>
  </div>

<script>
// ─── Game State ───────────────────────────────────────────────
const state = {
  turn: 1,
  cash: 10000,
  energy: { solar: 15, oil: 35, coal: 25, nuclear: 15, wind: 10 },
  stocks: [
    { ticker: 'XOM',    name: 'ExxonMobil', price: 105, type: 'oil' },
    { ticker: 'NEE',    name: 'NextEra',    price: 75,  type: 'solar' },
    { ticker: 'ORSTED', name: 'Ørsted',     price: 50,  type: 'wind' },
    { ticker: 'CCJ',    name: 'Cameco',     price: 42,  type: 'nuclear' },
    { ticker: '601857', name: '中國石油',   price: 12,  type: 'oil' },
    { ticker: '600688', name: '上海石化',   price: 8.5, type: 'oil' },
    { ticker: '600905', name: '三峽能源',   price: 28,  type: 'wind' },
    { ticker: '688798', name: '寧德時代',   price: 180, type: 'solar' }
  ],
  // CRUD: 持倉紀錄 { ticker, name, qty, avgCost }
  portfolio: [],
  countries: [
    { name: '台灣',   lat: 23.5, lon: 121,  economy: 100, solar: 15, coal: 30, nuclear: 20 },
    { name: 'USA',    lat: 38,   lon: -97,   economy: 500, solar: 25, oil: 40, gas: 35 },
    { name: '德國',   lat: 51,   lon: 10,    economy: 300, wind: 35, solar: 20, coal: 25 },
    { name: '沙烏地', lat: 24,   lon: 45,    economy: 250, oil: 80, solar: 10 },
    { name: '日本',   lat: 36,   lon: 138,   economy: 350, nuclear: 20, solar: 15, coal: 30 },
    { name: '中國',   lat: 35,   lon: 105,   economy: 600, coal: 50, solar: 15, wind: 10 }
  ],
  randomEvents: [
    { name: '中東衝突爆發',   effect: 'oil',    delta: +8 },
    { name: '颱風侵襲',       effect: 'solar',  delta: -5 },
    { name: '再生能源補助通過', effect: 'solar', delta: +5 },
    { name: '核電廠事故',     effect: 'nuclear', delta: -8 },
    { name: '碳稅加重',       effect: 'coal',   delta: -6 },
    { name: '風電技術突破',   effect: 'wind',   delta: +6 }
  ],
  log: [],
  apiStatus: 'loading' // 'loading' | 'ok' | 'fail'
};

// ─── API Fetch 工具函式 ───────────────────────────────────────
// CORS Proxy：讓瀏覽器可以存取跨域 API
const PROXY = 'https://api.allorigins.win/raw?url=';

function proxied(url) {
  return PROXY + encodeURIComponent(url);
}

async function fetchWithTimeout(url, timeout = 8000, useProxy = true) {
  const finalUrl = useProxy ? proxied(url) : url;
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  try {
    const res = await fetch(finalUrl, { signal: controller.signal });
    clearTimeout(id);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (e) {
    clearTimeout(id);
    throw e;
  }
}

function setDashboard(id, text, ok = true) {
  const el = document.getElementById(id);
  if (el) {
    el.textContent = text;
    el.style.opacity = ok ? '1' : '0.45';
  }
}

// ① 台電即時發電資料（透過 CORS Proxy）
async function fetchTaiwanPower() {
  try {
    const data = await fetchWithTimeout(
      'https://data.taipower.com.tw/opendata/apply/file/d006001/001.json'
    );
    if (data && Array.isArray(data)) {
      const solar   = data.find(d => d['能源別'] && d['能源別'].includes('太陽'));
      const nuclear = data.find(d => d['能源別'] && d['能源別'].includes('核能'));
      const wind    = data.find(d => d['能源別'] && d['能源別'].includes('風力'));
      const total   = data.find(d => d['能源別'] && d['能源別'].includes('合計'));

      if (solar)   state.countries[0].solar   = Math.round(parseFloat(solar['裝置容量(MW)'])   / 100) || 15;
      if (nuclear) state.countries[0].nuclear = Math.round(parseFloat(nuclear['裝置容量(MW)']) / 100) || 20;
      if (wind)    state.countries[0].wind    = Math.round(parseFloat(wind['裝置容量(MW)'])    / 100) || 5;

      const solarMW = solar ? parseFloat(solar['裝置容量(MW)']).toFixed(0) : '--';
      const totalMW = total ? parseFloat(total['裝置容量(MW)']).toFixed(0) : '--';

      setDashboard('rt-solar', `${solarMW} MW`);
      setDashboard('rt-power', `${totalMW} MW`);
      addLog('✓ 台電即時發電資料已更新');
      return true;
    }
  } catch (e) {
    setDashboard('rt-solar', '無法連線 --', false);
    setDashboard('rt-power', '無法連線 --', false);
    addLog('⚠ 台電API暫時無法連線');
  }
  return false;
}

// ② Yahoo Finance 油價（WTI，透過 CORS Proxy）
async function fetchOilPrice() {
  try {
    const data = await fetchWithTimeout(
      'https://query1.finance.yahoo.com/v8/finance/chart/CL=F?interval=1d&range=1d'
    );
    const price = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
    if (price && price > 0) {
      const xom = state.stocks.find(s => s.ticker === 'XOM');
      if (xom) xom.price = Math.max(50, Math.min(180, price * 0.85));
      setDashboard('rt-oil', `$${price.toFixed(2)}/桶`);
      addLog(`✓ WTI油價: $${price.toFixed(1)}/桶`);
      return true;
    }
  } catch (e) {
    const xom = state.stocks.find(s => s.ticker === 'XOM');
    if (xom) xom.price = Math.max(50, xom.price * (0.98 + Math.random() * 0.04));
    setDashboard('rt-oil', '無法連線 --', false);
    addLog('⚠ 油價API暫時無法連線，使用模擬波動');
  }
  return false;
}

// ③ 環保署 AQI（台灣，透過 CORS Proxy）
async function fetchAQI() {
  try {
    const data = await fetchWithTimeout(
      'https://data.epa.gov.tw/api/v2/aqx_p_432?api_key=9be7b239-557b-4c10-9775-78cadfc555e9&limit=10&sort=ImportDate desc&format=json'
    );
    const records = data?.records;
    if (records && records.length > 0) {
      const tc = records.find(r => r.sitename && r.sitename.includes('台中')) || records[0];
      const aqi = parseInt(tc.aqi) || 0;
      const aqiLabel = aqi <= 50  ? '良好🟢'
                     : aqi <= 100 ? '普通🟡'
                     : aqi <= 150 ? '敏感不良🟠'
                     : '不良🔴';
      setDashboard('rt-aqi', `AQI ${aqi} ${aqiLabel}`);

      // 遊戲連動：AQI 高 → 煤炭佔比受懲罰
      if (aqi > 100 && state.energy.coal > 10) {
        state.energy.coal = Math.max(5, state.energy.coal - 1);
        addLog(`⚠ 空汙警示！AQI ${aqi}，煤炭佔比下調`);
      }
      addLog(`✓ 台灣AQI: ${aqi} (${tc.sitename || ''})`);
      return true;
    }
  } catch (e) {
    setDashboard('rt-aqi', '無法連線 --', false);
    addLog('⚠ 環保署AQI API暫時無法連線');
  }
  return false;
}

// ④ 世界銀行：台灣用電 + 全球碳排（不需 Proxy，世銀原生支援 CORS）
async function fetchWorldBankData() {
  try {
    // 台灣人均用電量（kWh）—— 世銀原生支援 CORS，不需 proxy
    const twData = await fetchWithTimeout(
      'https://api.worldbank.org/v2/country/TW/indicator/EG.USE.ELEC.KH.PC?format=json&mrv=1',
      8000,
      false  // 世銀不需要 proxy
    );
    const twVal = twData?.[1]?.[0];
    if (twVal && twVal.value) {
      setDashboard('rt-twenergy', `${Math.round(twVal.value).toLocaleString()} kWh/人`);
    }

    // 全球 CO2 排放
    const co2Data = await fetchWithTimeout(
      'https://api.worldbank.org/v2/country/WLD/indicator/EN.ATM.CO2E.KT?format=json&mrv=1',
      8000,
      false  // 世銀不需要 proxy
    );
    const co2Val = co2Data?.[1]?.[0];
    if (co2Val && co2Val.value) {
      const gt = (co2Val.value / 1e6).toFixed(1);
      setDashboard('rt-carbon', `${gt} Gt CO₂`);
      addLog(`✓ 世界銀行：全球碳排 ${gt} Gt`);
    }
    return true;
  } catch (e) {
    setDashboard('rt-twenergy', '無法連線 --', false);
    setDashboard('rt-carbon',   '無法連線 --', false);
    addLog('⚠ 世界銀行API暫時無法連線');
  }
  return false;
}

// ⑤ 初始化所有 API
async function initAPIs() {
  updateApiDot('loading');
  const results = await Promise.allSettled([
    fetchTaiwanPower(),
    fetchOilPrice(),
    fetchAQI(),
    fetchWorldBankData()
  ]);
  const anyOk = results.some(r => r.value === true);
  state.apiStatus = anyOk ? 'ok' : 'fail';
  updateApiDot(state.apiStatus);
  render();

  // 定期更新（快速更新：台電+油價+AQI 每60秒；世銀數據每10分鐘）
  setInterval(() => {
    fetchTaiwanPower();
    fetchOilPrice();
    fetchAQI();
    render();
  }, 60000);
  setInterval(() => { fetchWorldBankData(); }, 600000);
}

function updateApiDot(status) {
  const dot = document.querySelector('#api-status .api-dot');
  if (!dot) return;
  dot.className = 'api-dot ' + status;
  document.getElementById('api-status').title =
    status === 'ok' ? 'API 連線正常' :
    status === 'fail' ? 'API 連線失敗，使用模擬數據' : 'API 連線中...';
}

// ─── CRUD：持倉管理 ───────────────────────────────────────────

// CREATE：買入
function openBuyModal() {
  const sel = document.getElementById('buy-ticker');
  sel.innerHTML = state.stocks.map(s =>
    `<option value="${s.ticker}">${s.ticker} - ${s.name} ($${s.price.toFixed(1)})</option>`
  ).join('');
  document.getElementById('buy-qty').value = 1;
  updateBuyCost();
  document.getElementById('buy-modal').classList.remove('hidden');
}

function updateBuyCost() {
  const ticker = document.getElementById('buy-ticker').value;
  const qty = parseInt(document.getElementById('buy-qty').value) || 0;
  const stock = state.stocks.find(s => s.ticker === ticker);
  if (stock) {
    const cost = stock.price * qty;
    document.getElementById('buy-cost').textContent =
      `預計花費：$${cost.toFixed(1)}M　(持有資金：$${state.cash}M)`;
  }
}
document.getElementById('buy-ticker').addEventListener('change', updateBuyCost);
document.getElementById('buy-qty').addEventListener('input', updateBuyCost);

function confirmBuy() {
  const ticker = document.getElementById('buy-ticker').value;
  const qty = parseInt(document.getElementById('buy-qty').value) || 0;
  if (qty <= 0) return alert('請輸入有效數量');
  const stock = state.stocks.find(s => s.ticker === ticker);
  const cost = stock.price * qty;
  if (cost > state.cash) return alert('資金不足！');

  state.cash = Math.round(state.cash - cost);
  // 找既有持倉或新增
  let holding = state.portfolio.find(p => p.ticker === ticker);
  if (holding) {
    // UPDATE avgCost
    const totalCost = holding.avgCost * holding.qty + stock.price * qty;
    holding.qty += qty;
    holding.avgCost = totalCost / holding.qty;
  } else {
    // CREATE
    state.portfolio.push({ ticker, name: stock.name, qty, avgCost: stock.price });
  }
  addLog(`買入 ${ticker} x${qty} @$${stock.price.toFixed(1)} (-$${cost.toFixed(1)}M)`);
  closeModal('buy-modal');
  render();
}

// READ：顯示持倉（renderPortfolio 中處理）

// UPDATE + DELETE：賣出
function openSellModal() {
  if (state.portfolio.length === 0) return alert('你目前沒有持倉！');
  const sel = document.getElementById('sell-ticker');
  sel.innerHTML = state.portfolio.map(p => {
    const stock = state.stocks.find(s => s.ticker === p.ticker);
    const currentPrice = stock ? stock.price : p.avgCost;
    const pnl = ((currentPrice - p.avgCost) / p.avgCost * 100).toFixed(1);
    return `<option value="${p.ticker}">${p.ticker} x${p.qty} (${pnl >= 0 ? '+' : ''}${pnl}%)</option>`;
  }).join('');
  document.getElementById('sell-qty').value = 1;
  updateSellInfo();
  document.getElementById('sell-modal').classList.remove('hidden');
}

function updateSellInfo() {
  const ticker = document.getElementById('sell-ticker').value;
  const qty = parseInt(document.getElementById('sell-qty').value) || 0;
  const holding = state.portfolio.find(p => p.ticker === ticker);
  const stock = state.stocks.find(s => s.ticker === ticker);
  if (holding && stock) {
    const revenue = stock.price * qty;
    const pnl = (stock.price - holding.avgCost) * qty;
    document.getElementById('sell-info').textContent =
      `持有：${holding.qty}股　預計收回：$${revenue.toFixed(1)}M　損益：${pnl >= 0 ? '+' : ''}$${pnl.toFixed(1)}M`;
  }
}
document.getElementById('sell-ticker').addEventListener('change', updateSellInfo);
document.getElementById('sell-qty').addEventListener('input', updateSellInfo);

function confirmSell() {
  const ticker = document.getElementById('sell-ticker').value;
  const qty = parseInt(document.getElementById('sell-qty').value) || 0;
  if (qty <= 0) return alert('請輸入有效數量');
  const holding = state.portfolio.find(p => p.ticker === ticker);
  if (!holding) return alert('找不到持倉');
  if (qty > holding.qty) return alert(`持有數量不足（僅有 ${holding.qty} 股）`);

  const stock = state.stocks.find(s => s.ticker === ticker);
  const revenue = stock.price * qty;
  const pnl = (stock.price - holding.avgCost) * qty;
  state.cash = Math.round(state.cash + revenue);

  if (qty === holding.qty) {
    // DELETE：全部賣出，移除持倉
    state.portfolio = state.portfolio.filter(p => p.ticker !== ticker);
  } else {
    // UPDATE：部分賣出
    holding.qty -= qty;
  }
  addLog(`賣出 ${ticker} x${qty} @$${stock.price.toFixed(1)} (+$${revenue.toFixed(1)}M, 損益:${pnl >= 0 ? '+' : ''}$${pnl.toFixed(1)}M)`);
  closeModal('sell-modal');
  render();
}

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

// ─── Render ──────────────────────────────────────────────────
function renderMarket() {
  const colors = { solar:'yellow', oil:'gray', coal:'orange', nuclear:'purple', wind:'cyan' };
  const icons  = { solar:'☀️', oil:'🛢️', coal:'⚫', nuclear:'⚛️', wind:'💨' };
  document.getElementById('energy-market').innerHTML =
    Object.entries(state.energy).map(([k,v]) =>
      `<div class="flex justify-between items-center gap-1">
        <span class="text-${colors[k]}-300 flex-shrink-0">${icons[k]} ${k}</span>
        <div class="h-1.5 rounded bg-gray-700 overflow-hidden flex-1">
          <div class="h-full bg-${colors[k]}-500 rounded" style="width:${v}%"></div>
        </div>
        <span class="text-${colors[k]}-200 w-8 text-right">${v}%</span>
      </div>`
    ).join('');
}

function renderStocks() {
  document.getElementById('stock-market').innerHTML =
    state.stocks.map(s => {
      const holding = state.portfolio.find(p => p.ticker === s.ticker);
      const pnl = holding ? ((s.price - holding.avgCost) / holding.avgCost * 100).toFixed(1) : null;
      return `<div class="flex justify-between items-center text-emerald-200 gap-1">
        <span class="font-mono flex-shrink-0 text-xs">${s.ticker}</span>
        <span class="text-emerald-400/60 text-xs flex-1 truncate">${s.name}</span>
        <span class="font-bold text-xs flex-shrink-0">$${s.price.toFixed(1)}</span>
        ${pnl !== null ? `<span class="text-xs ${parseFloat(pnl)>=0?'text-emerald-400':'text-red-400'}">${pnl>=0?'+':''}${pnl}%</span>` : ''}
      </div>`;
    }).join('');
}

function renderPortfolio() {
  const el = document.getElementById('portfolio');
  if (state.portfolio.length === 0) {
    el.innerHTML = '<div class="text-emerald-200/40">尚未持有任何股票</div>';
    return;
  }
  let totalPnl = 0;
  el.innerHTML = state.portfolio.map(p => {
    const stock = state.stocks.find(s => s.ticker === p.ticker);
    const cur = stock ? stock.price : p.avgCost;
    const pnl = (cur - p.avgCost) * p.qty;
    totalPnl += pnl;
    const pct = ((cur - p.avgCost) / p.avgCost * 100).toFixed(1);
    return `<div class="portfolio-row">
      <span class="font-mono text-emerald-300">${p.ticker}</span>
      <span class="text-emerald-200/60">x${p.qty}</span>
      <span class="text-emerald-200/60">成本$${p.avgCost.toFixed(1)}</span>
      <span class="${pnl>=0?'text-emerald-400':'text-red-400'}">${pnl>=0?'+':''}$${pnl.toFixed(1)}M (${pct}%)</span>
    </div>`;
  }).join('') +
  `<div class="portfolio-row mt-1 border-t border-emerald-500/20 pt-1">
    <span class="text-emerald-300 font-bold">總損益</span>
    <span class="${totalPnl>=0?'text-emerald-400 font-bold':'text-red-400 font-bold'}">${totalPnl>=0?'+':''}$${totalPnl.toFixed(1)}M</span>
  </div>`;
}

function renderLog() {
  document.getElementById('event-log').innerHTML =
    state.log.slice(-8).reverse().map(e => `<div>⚡ ${e}</div>`).join('');
}

function updateHUD() {
  document.getElementById('turn-num').textContent = state.turn;
  document.getElementById('player-cash').textContent = state.cash.toLocaleString();
}

function addLog(msg) {
  state.log.push(`[回合${state.turn}] ${msg}`);
}

function render() {
  renderMarket();
  renderStocks();
  renderPortfolio();
  renderLog();
  updateHUD();
}

// ─── Game Actions ─────────────────────────────────────────────
function invest(type) {
  if (state.cash < 500) { alert('資金不足！至少需要 $500M'); return; }
  state.cash -= 500;
  state.energy[type] = Math.min(60, (state.energy[type] || 0) + 3);
  // 重新正規化，保持總和 100
  const total = Object.values(state.energy).reduce((a,b) => a+b, 0);
  Object.keys(state.energy).forEach(k => state.energy[k] = Math.max(1, Math.round(state.energy[k] / total * 100)));
  addLog(`投資 ${type} 能源 (-$500M，佔比+3%)`);
  render();
}

function nextTurn() {
  state.turn++;
  // 收入：根據再生能源佔比浮動
  const renewableRatio = (state.energy.solar + state.energy.wind) / 100;
  const income = Math.round(120 + renewableRatio * 80 + Math.random() * 80);
  state.cash += income;
  addLog(`回合收入 +$${income}M`);

  // 股價隨機波動
  state.stocks.forEach(s => {
    s.price = Math.max(1, s.price * (0.93 + Math.random() * 0.16));
  });

  // 隨機事件（40% 機率）
  if (Math.random() > 0.6) {
    const ev = state.randomEvents[Math.floor(Math.random() * state.randomEvents.length)];
    if (state.energy[ev.effect] !== undefined) {
      state.energy[ev.effect] = Math.max(1, Math.min(70, state.energy[ev.effect] + ev.delta));
    }
    addLog(`[事件] ${ev.name}`);
  }

  render();
}

// ─── 3D Globe ─────────────────────────────────────────────────
const canvas = document.getElementById('globe');
const ctx = canvas.getContext('2d', { alpha: true });

function resizeCanvas() {
  const parent = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = parent.clientWidth  * dpr;
  canvas.height = parent.clientHeight * dpr;
  ctx.scale(dpr, dpr);
}

let rotX = 0.3, rotY = 0, dragging = false, lastX = 0, lastY = 0, autoRotate = true;

canvas.addEventListener('mousedown', e => { dragging = true; autoRotate = false; lastX = e.clientX; lastY = e.clientY; });
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  rotY += (e.clientX - lastX) * 0.005;
  rotX  = Math.max(-1.5, Math.min(1.5, rotX + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('mouseup',    () => { dragging = false; setTimeout(() => autoRotate = true, 3000); });
canvas.addEventListener('mouseleave', () => { dragging = false; });
canvas.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  dragging = true; autoRotate = false;
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (!dragging || e.touches.length !== 1) return;
  rotY += (e.touches[0].clientX - lastX) * 0.008;
  rotX  = Math.max(-1.5, Math.min(1.5, rotX + (e.touches[0].clientY - lastY) * 0.008));
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchend', () => { dragging = false; setTimeout(() => autoRotate = true, 3000); }, { passive: true });

function project(lat, lon) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  const R = 200;
  let x = R * Math.sin(phi) * Math.cos(theta);
  let y = R * Math.cos(phi);
  let z = R * Math.sin(phi) * Math.sin(theta);
  let x2 = x * Math.cos(rotY) - z * Math.sin(rotY);
  let z2 = x * Math.sin(rotY) + z * Math.cos(rotY);
  let y2 = y * Math.cos(rotX) - z2 * Math.sin(rotX);
  let z3 = y * Math.sin(rotX) + z2 * Math.cos(rotX);
  return { x: x2, y: y2, z: z3 };
}

const continents = [
  [[70,-170],[72,-130],[65,-90],[50,-60],[30,-80],[25,-100],[30,-120],[50,-130],[60,-150],[70,-170]],
  [[10,-75],[5,-35],[-10,-35],[-35,-55],[-55,-70],[-40,-65],[-20,-40],[0,-50],[10,-75]],
  [[35,-10],[40,0],[45,10],[50,5],[55,10],[60,25],[70,30],[65,50],[55,40],[45,30],[40,25],[35,25],[35,-10]],
  [[35,-10],[35,35],[20,40],[10,45],[0,40],[-15,40],[-35,20],[-35,18],[-5,10],[5,-5],[15,-15],[35,-10]],
  [[65,50],[70,140],[60,160],[50,140],[35,130],[20,110],[10,105],[5,100],[10,80],[25,65],[35,50],[45,50],[55,70],[65,50]],
  [[-15,130],[-10,150],[-25,153],[-35,150],[-38,145],[-35,115],[-20,115],[-15,130]]
];

function drawGlobe() {
  const W = canvas.width / (window.devicePixelRatio || 1);
  const H = canvas.height / (window.devicePixelRatio || 1);
  if (!W || !H) { requestAnimationFrame(drawGlobe); return; }
  const cx = W/2, cy = H/2;

  ctx.clearRect(0, 0, W, H);

  // Glow backdrop
  const grd = ctx.createRadialGradient(cx, cy, 180, cx, cy, 260);
  grd.addColorStop(0, 'rgba(0,255,136,0.05)');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // Ocean
  ctx.beginPath();
  ctx.arc(cx, cy, 200, 0, Math.PI*2);
  ctx.fillStyle = '#0a2540';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,255,136,0.3)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Grid
  ctx.strokeStyle = 'rgba(0,255,136,0.08)';
  ctx.lineWidth = 0.5;
  for (let lat = -60; lat <= 60; lat += 30) {
    ctx.beginPath();
    for (let lon = 0; lon <= 360; lon += 5) {
      const p = project(lat, lon - 180);
      if (p.z > 0) ctx.lineTo(cx+p.x, cy-p.y);
      else ctx.moveTo(cx+p.x, cy-p.y);
    }
    ctx.stroke();
  }
  for (let lon = -180; lon < 180; lon += 30) {
    ctx.beginPath();
    for (let lat = -90; lat <= 90; lat += 5) {
      const p = project(lat, lon);
      if (p.z > 0) ctx.lineTo(cx+p.x, cy-p.y);
      else ctx.moveTo(cx+p.x, cy-p.y);
    }
    ctx.stroke();
  }

  // Continents
  ctx.strokeStyle = 'rgba(0,255,136,0.6)';
  ctx.fillStyle = 'rgba(0,255,136,0.12)';
  ctx.lineWidth = 1.2;
  continents.forEach(cont => {
    ctx.beginPath();
    let started = false;
    cont.forEach(([lat, lon]) => {
      const p = project(lat, lon);
      if (p.z > 0) {
        if (!started) { ctx.moveTo(cx+p.x, cy-p.y); started = true; }
        else ctx.lineTo(cx+p.x, cy-p.y);
      } else { started = false; }
    });
    ctx.fill();
    ctx.stroke();
  });

  // Country dots
  state.countries.forEach(c => {
    const p = project(c.lat, c.lon);
    if (p.z > 0) {
      ctx.beginPath();
      ctx.arc(cx+p.x, cy-p.y, 5, 0, Math.PI*2);
      ctx.fillStyle = '#00ff88';
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '10px "Noto Sans TC"';
      ctx.fillText(c.name, cx+p.x+8, cy-p.y+4);
    }
  });

  if (autoRotate) rotY += 0.003;
  requestAnimationFrame(drawGlobe);
}

// Country click
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const mx = (e.clientX - rect.left) * dpr;
  const my = (e.clientY - rect.top)  * dpr;
  const W = canvas.width / dpr, H = canvas.height / dpr;
  const cx = W/2, cy = H/2;
  let found = null;
  state.countries.forEach(c => {
    const p = project(c.lat, c.lon);
    if (p.z > 0) {
      const dx = (cx+p.x)*dpr - mx, dy = (cy-p.y)*dpr - my;
      if (Math.sqrt(dx*dx+dy*dy) < 20) found = c;
    }
  });
  const info = document.getElementById('country-info');
  if (found) {
    document.getElementById('ci-name').textContent = found.name;
    document.getElementById('ci-details').innerHTML = `
      <div>經濟規模: ${found.economy}</div>
      ${found.solar   ? `<div>☀️ 太陽: ${found.solar}%</div>`   : ''}
      ${found.oil     ? `<div>🛢️ 石油: ${found.oil}%</div>`     : ''}
      ${found.coal    ? `<div>⚫ 煤: ${found.coal}%</div>`       : ''}
      ${found.nuclear ? `<div>⚛️ 核能: ${found.nuclear}%</div>` : ''}
      ${found.wind    ? `<div>💨 風能: ${found.wind}%</div>`     : ''}
      ${found.gas     ? `<div>🔥 天然氣: ${found.gas}%</div>`   : ''}
    `;
    info.classList.remove('hidden');
  } else {
    info.classList.add('hidden');
  }
});

// ─── Init ────────────────────────────────────────────────────
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));
render();
drawGlobe();
lucide.createIcons();
initAPIs();
</script>

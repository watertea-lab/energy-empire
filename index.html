<!doctype html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content=\"yes\">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Energy Empire</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    #app { width: 100%; height: 100%; }
    .globe-canvas { display: block; width: 100%; height: 100%; background: radial-gradient(circle at center, #080d1a 0%, #02040a 100%); }
    .hud-panel { background: rgba(10, 17, 34, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(2,4,10,0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(16,185,129,0.3); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(16,185,129,0.5); }
    @keyframes pulse-fast { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .animate-pulse-fast { animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body class="bg-[#02040a] text-slate-100 font-['Noto_Sans_TC'] overflow-hidden h-full">
  <div id="app" class="relative flex flex-col justify-between p-3 md:p-5 box-border">
    <div class="absolute inset-0 z-0">
      <canvas id="globe" class="globe-canvas"></canvas>
    </div>

    <header class="hud-panel relative z-10 w-full rounded-xl px-4 py-3 flex justify-between items-center shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse-fast"></div>
        <h1 class="font-['Orbitron'] font-black tracking-widest text-emerald-400 text-lg md:text-xl">ENERGY EMPIRE</h1>
      </div>
      <div class="flex items-center gap-4 md:gap-6 text-xs md:text-sm font-['Orbitron']">
        <div class="text-right">
          <span class="text-slate-400 block text-[10px] uppercase tracking-wider">Turn</span>
          <span id="stat-turn" class="text-emerald-400 font-bold text-base md:text-lg">1</span>
        </div>
        <div class="text-right">
          <span class="text-slate-400 block text-[10px] uppercase tracking-wider">Funds</span>
          <span id="stat-funds" class="text-emerald-400 font-bold text-base md:text-lg">$1,000,000</span>
        </div>
        <div class="text-right">
          <span class="text-slate-400 block text-[10px] uppercase tracking-wider">Clean Power</span>
          <span id="stat-clean" class="text-emerald-400 font-bold text-base md:text-lg">0%</span>
        </div>
      </div>
    </header>

    <main class="relative z-10 flex-grow w-full my-4 overflow-hidden pointer-events-none flex items-center justify-center">
      <div id="country-info" class="hud-panel pointer-events-auto rounded-xl p-4 w-72 max-w-full opacity-0 translate-y-4 transition-all duration-300 shadow-2xl absolute">
        <div class="flex justify-between items-start mb-3 border-b border-emerald-500/20 pb-2">
          <h2 id="ci-name" class="text-emerald-400 font-bold text-base tracking-wide">國家名稱</h2>
          <button onclick="closeCountryInfo()" class="text-slate-400 hover:text-slate-200 transition-colors">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="ci-details" class="space-y-2 text-xs text-slate-300"></div>
        <div class="mt-4 flex gap-2">
          <button onclick="investGreen()" class="flex-1 bg-emerald-600/30 hover:bg-emerald-600/50 border border-emerald-500/40 text-emerald-300 font-medium py-1.5 px-3 rounded-lg text-xs transition-all active:scale-95">投資綠能 (-$200K)</button>
        </div>
      </div>
    </main>

    <footer class="relative z-10 w-full grid grid-cols-1 lg:grid-cols-12 gap-4 shrink-0 pointer-events-none">
      <div class="hud-panel pointer-events-auto lg:col-span-7 rounded-xl p-4 flex flex-col h-56 md:h-64">
        <div class="flex justify-between items-center mb-2 shrink-0">
          <div class="flex items-center gap-2">
            <i data-lucide="trending-up" class="w-4 h-4 text-emerald-400"></i>
            <h3 class="font-['Orbitron'] text-xs font-bold uppercase tracking-wider text-slate-300">Global Energy Stocks</h3>
          </div>
          <span id="api-status" class="text-[10px] font-['Orbitron'] text-slate-500 uppercase tracking-widest">Connecting API...</span>
        </div>
        
        <div class="flex-grow overflow-y-auto pr-1">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="border-b border-emerald-500/10 text-slate-400 font-medium">
                <th class="py-1.5 font-normal">Symbol</th>
                <th class="py-1.5 font-normal">Price</th>
                <th class="py-1.5 font-normal">Chg</th>
                <th class="py-1.5 font-normal text-right">Owned</th>
                <th class="py-1.5 font-normal text-right">Action</th>
              </tr>
            </thead>
            <tbody id="stock-list" class="divide-y divide-emerald-500/5 font-['Orbitron']"></tbody>
          </table>
        </div>
      </div>

      <div class="hud-panel pointer-events-auto lg:col-span-5 rounded-xl p-4 flex flex-col justify-between h-56 md:h-64">
        <div class="flex-grow flex flex-col overflow-hidden mb-3">
          <div class="flex items-center gap-2 mb-2 shrink-0">
            <i data-lucide="terminal" class="w-4 h-4 text-emerald-400"></i>
            <h3 class="font-['Orbitron'] text-xs font-bold uppercase tracking-wider text-slate-300">Empire Log</h3>
          </div>
          <div id="log-content" class="flex-grow overflow-y-auto text-[11px] text-slate-400 space-y-1.5 pr-1 font-mono leading-relaxed select-text"></div>
        </div>

        <div class="flex items-center gap-3 shrink-0">
          <button onclick="nextTurn()" class="flex-grow bg-emerald-500 hover:bg-emerald-400 text-[#02040a] font-['Orbitron'] font-black tracking-widest py-2.5 px-4 rounded-lg text-xs transition-all active:scale-[0.98] shadow-[0_0_15px_rgba(16,185,129,0.3)] flex justify-center items-center gap-2">
            NEXT TURN <i data-lucide="chevron-right" class="w-4 h-4 stroke-[3]"></i>
          </button>
          
          <button onclick="toggleMusic(this)" class="hud-panel border border-emerald-500/20 hover:bg-emerald-500/10 p-2.5 rounded-lg transition-all active:scale-95 flex justify-center items-center" title="切換背景音樂">
            <i data-lucide="volume-x" class="w-4 h-4 text-slate-400"></i>
          </button>
        </div>
      </div>
    </footer>

    <div id="trade-modal" class="fixed inset-0 bg-[#02040a]/80 backdrop-filter blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 p-4">
      <div class="hud-panel rounded-2xl p-5 w-80 max-w-full transform scale-95 transition-all duration-300 shadow-2xl">
        <div class="flex justify-between items-center mb-4 border-b border-emerald-500/20 pb-2">
          <h3 id="modal-title" class="text-emerald-400 font-bold font-['Orbitron'] tracking-wide">STOCK TRADE</h3>
          <button onclick="closeTradeModal()" class="text-slate-400 hover:text-slate-200 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="space-y-3 text-xs">
          <div class="flex justify-between font-['Orbitron']"><span class="text-slate-400">現價 Price:</span><span id="modal-price" class="text-emerald-400 font-bold">--</span></div>
          <div class="flex justify-between font-['Orbitron']"><span class="text-slate-400">可用資金 Funds:</span><span id="modal-funds" class="text-slate-300">--</span></div>
          <div class="flex justify-between font-['Orbitron']"><span class="text-slate-400">目前持股 Position:</span><span id="modal-owned" class="text-slate-300">--</span></div>
          <div class="flex flex-col gap-1.5 pt-2">
            <label class="text-slate-400 text-[11px]">輸入交易股數 Quantity:</label>
            <input id="trade-qty" type="number" min="1" value="10" class="bg-[#050914] border border-emerald-500/30 rounded-lg py-2 px-3 text-emerald-400 font-bold font-['Orbitron'] focus:outline-none focus:border-emerald-500/60 text-sm">
          </div>
        </div>
        <div class="mt-5 flex gap-3">
          <button onclick="confirmBuy()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-[#02040a] font-bold py-2 rounded-lg text-xs transition-all active:scale-95">買入 BUY</button>
          <button onclick="confirmSell()" class="flex-1 bg-rose-600/20 hover:bg-rose-600/40 border border-rose-500/40 text-rose-300 font-bold py-2 rounded-lg text-xs transition-all active:scale-95">賣出 SELL</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="bgm1" src="./audio/bgm.mp3" preload="auto"></audio>
  <audio id="bgm2" src="./audio/bgm2.mp3" preload="auto"></audio>

  <script>
    // ═══════════════════════════════════════════════
    // 遊戲核心狀態與初始化
    // ═══════════════════════════════════════════════
    const state = {
      turn: 1,
      funds: 1000000,
      selectedCountry: null,
      selectedStock: null,
      countries: [
        { id: 'tw', name: '台灣 Taiwan', lat: 23.7, lon: 121.0, economy: '高科技樞紐', solar: 12, oil: 40, coal: 38, nuclear: 10, wind: 0 },
        { id: 'us', name: '美國 USA', lat: 37.0, lon: -95.7, economy: '超級大國', solar: 8, oil: 35, coal: 22, nuclear: 19, wind: 16 },
        { id: 'cn', name: '中國 China', lat: 35.8, lon: 104.1, economy: '製造業巨頭', solar: 10, oil: 18, coal: 56, nuclear: 5, wind: 11 },
        { id: 'eu', name: '歐洲聯盟 EU', lat: 48.5, lon: 9.1, economy: '綠能領航者', solar: 22, oil: 12, coal: 14, nuclear: 24, wind: 28 }
      ],
      stocks: [
        { symbol: 'XOM', name: 'Exxon Mobil', price: 118.5, chg: 0, owned: 0, avgCost: 0 },
        { symbol: 'NEE', name: 'NextEra Energy', price: 72.3, chg: 0, owned: 0, avgCost: 0 },
        { symbol: '601857.SS', name: 'PetroChina', price: 10.2, chg: 0, owned: 0, avgCost: 0 },
        { symbol: '300750.SZ', name: 'CATL', price: 255.0, chg: 0, owned: 0, avgCost: 0 },
        { symbol: 'ORSTED.CO', name: 'Ørsted', price: 415.0, chg: 0, owned: 0, avgCost: 0 }
      ],
      log: ['[SYSTEM] 能源戰略系統已啟動。', '[INFO] 點擊 3D 地球上的綠點可查看該區域能源結構並投資綠能。']
    };

    // ═══════════════════════════════════════════════
    // 3D Canvas 地球儀渲染引擎
    // ═══════════════════════════════════════════════
    const canvas = document.getElementById('globe');
    const ctxCanvas = canvas.getContext('2d');
    let globeRadius = 200;
    let rotX = 0.3, rotY = 0;
    let autoRotate = true;
    let isDragging = false;
    let lastX = 0, lastY = 0;

    // 世界陸地極簡粗略經緯度矩陣（維持高科技點陣氛圍）
    const landPoints = [];
    for (let lat = -60; lat <= 70; lat += 4) {
      for (let lon = -180; lon <= 180; lon += 4) {
        let isLand = false;
        // 北美
        if (lat > 15 && lat < 70 && lon > -160 && lon < -50) isLand = true;
        // 南美
        if (lat > -55 && lat <= 12 && lon > -80 && lon < -35) isLand = true;
        // 歐亞大陸
        if (lat > 10 && lat < 75 && lon > -10 && lon < 170) {
          isLand = true;
          if (lat > 10 && lat < 30 && lon > 40 && lon < 60) isLand = true; // 中東
          if (lat > 5 && lat < 25 && lon > 70 && lon < 90) isLand = true;  // 印度
        }
        // 非洲
        if (lat > -35 && lat <= 35 && lon > -15 && lon < 50) {
          if (!(lat > 10 && lon > 35)) isLand = true;
        }
        // 澳洲
        if (lat > -40 && lat < -10 && lon > 110 && lon < 155) isLand = true;
        
        if (isLand && Math.random() > 0.15) {
          landPoints.push({ lat, lon });
        }
      }
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.parentElement.clientWidth * dpr;
      canvas.height = canvas.parentElement.clientHeight * dpr;
      ctxCanvas.scale(dpr, dpr);
      globeRadius = Math.min(canvas.parentElement.clientWidth, canvas.parentElement.clientHeight) * 0.38;
      if (globeRadius < 120) globeRadius = 120;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 3D 投影核心演算法
    function project(lat, lon) {
      let radLat = lat * Math.PI / 180;
      let radLon = lon * Math.PI / 180;
      let x = globeRadius * Math.cos(radLat) * Math.sin(radLon);
      let y = globeRadius * Math.sin(radLat);
      let z = globeRadius * Math.cos(radLat) * Math.cos(radLon);

      // 繞 Y 軸旋轉 (自轉)
      let x1 = x * Math.cos(rotY) - z * Math.sin(rotY);
      let z1 = x * Math.sin(rotY) + z * Math.cos(rotY);
      // 繞 X 軸旋轉 (俯仰)
      let y2 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
      let z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);

      return { x: x1, y: y2, z: z2 };
    }

    // 繪製與動畫渲染循環
    function drawGlobe() {
      const W = canvas.width / (window.devicePixelRatio || 1);
      const H = canvas.height / (window.devicePixelRatio || 1);
      const cx = W / 2, cy = H / 2;

      ctxCanvas.clearRect(0, 0, W, H);

      // 1. 繪製地球背景氛圍大氣光暈
      let glow = ctxCanvas.createRadialGradient(cx, cy, globeRadius * 0.8, cx, cy, globeRadius * 1.2);
      glow.addColorStop(0, 'rgba(16, 185, 129, 0.04)');
      glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctxCanvas.fillStyle = glow;
      ctxCanvas.beginPath(); ctxCanvas.arc(cx, cy, globeRadius * 1.3, 0, Math.PI * 2); ctxCanvas.fill();

      // 地球基底深色圓形
      ctxCanvas.fillStyle = '#040814';
      ctxCanvas.beginPath(); ctxCanvas.arc(cx, cy, globeRadius, 0, Math.PI * 2); ctxCanvas.fill();
      ctxCanvas.strokeStyle = 'rgba(16, 185, 129, 0.1)';
      ctxCanvas.lineWidth = 1;
      ctxCanvas.stroke();

      // 2. 繪製低解析點陣陸地
      ctxCanvas.fillStyle = 'rgba(16, 185, 129, 0.25)';
      landPoints.forEach(pt => {
        let p = project(pt.lat, pt.lon);
        if (p.z > 0) { // 背面隱藏
          let size = (p.z / globeRadius) * 1.5 + 0.5;
          ctxCanvas.beginPath();
          ctxCanvas.arc(cx + p.x, cy - p.y, size, 0, Math.PI * 2);
          ctxCanvas.fill();
        }
      });

      // 3. 繪製主要國家互動核心節點
      state.countries.forEach(c => {
        let p = project(c.lat, c.lon);
        if (p.z > 0) {
          let isSelected = state.selectedCountry && state.selectedCountry.id === c.id;
          
          // 外圍波紋動畫
          let pulse = (Date.now() % 1500) / 1500;
          ctxCanvas.strokeStyle = isSelected ? `rgba(52, 211, 153, ${1 - pulse})` : `rgba(16, 185, 129, ${0.6 * (1 - pulse)})`;
          ctxCanvas.lineWidth = 1.5;
          ctxCanvas.beginPath();
          ctxCanvas.arc(cx + p.x, cy - p.y, 4 + pulse * 12, 0, Math.PI * 2);
          ctxCanvas.stroke();

          // 核心實心點
          ctxCanvas.fillStyle = isSelected ? '#34d399' : '#10b981';
          ctxCanvas.shadowBlur = isSelected ? 12 : 6;
          ctxCanvas.shadowColor = '#10b981';
          ctxCanvas.beginPath();
          ctxCanvas.arc(cx + p.x, cy - p.y, isSelected ? 5 : 4, 0, Math.PI * 2);
          ctxCanvas.fill();
          ctxCanvas.shadowBlur = 0; // 重置陰影

          // 國家文字標籤
          ctxCanvas.fillStyle = isSelected ? '#34d399' : 'rgba(255, 255, 255, 0.7)';
          ctxCanvas.font = isSelected ? 'bold 11px Noto Sans TC' : '10px Noto Sans TC';
          ctxCanvas.fillText(c.name.split(' ')[0], cx + p.x + 8, cy - p.y + 3);
        }
      });

      // 🛠️ 修正旋轉速度與物理自轉方向（改為 -= 0.001 慢速自西向東轉）
      if (autoRotate && !isDragging) rotY -= 0.001; 

      requestAnimationFrame(drawGlobe);
    }

    // ═══════════════════════════════════════════════
    // 3D 地球滑鼠與觸控互動監聽
    // ═══════════════════════════════════════════════
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    // 🛠️ 修正滑鼠拖曳旋轉的體感方向，同步改為減號（-=）
    canvas.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      let dx = e.clientX - lastX;
      let dy = e.clientY - lastY;
      rotY -= dx * 0.005; 
      rotX += dy * 0.005;
      if (rotX > Math.PI / 2.2) rotX = Math.PI / 2.2;
      if (rotX < -Math.PI / 2.2) rotX = -Math.PI / 2.2;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      }
    }, { passive: true });

    // 🛠️ 修正手機觸控滑動的體感方向，同步改為減號（-=）
    canvas.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      let dx = e.touches[0].clientX - lastX;
      let dy = e.touches[0].clientY - lastY;
      rotY -= dx * 0.008; 
      rotX += dy * 0.008;
      if (rotX > Math.PI / 2.2) rotX = Math.PI / 2.2;
      if (rotX < -Math.PI / 2.2) rotX = -Math.PI / 2.2;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', () => { isDragging = false; });

    // 地球節點點擊判定邏輯
    canvas.addEventListener('click', (e) => {
      if (Math.abs(e.clientX - lastX) > 5 || Math.abs(e.clientY - lastY) > 5) return; // 屬於拖曳不觸發點擊
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const mx = (e.clientX - rect.left) * dpr;
      const my = (e.clientY - rect.top) * dpr;
      const W = canvas.width / dpr, H = canvas.height / dpr;
      const cx = W / 2, cy = H / 2;
      
      let found = null;
      state.countries.forEach(c => {
        let p = project(c.lat, c.lon);
        if (p.z > 0) {
          let dx = (cx + p.x) * dpr - mx;
          let dy = (cy - p.y) * dpr - my;
          if (Math.sqrt(dx * dx + dy * dy) < 22 * dpr) found = c;
        }
      });

      if (found) {
        state.selectedCountry = found;
        openCountryInfo(found, e.clientX, e.clientY);
      } else {
        closeCountryInfo();
      }
    });

    // ═══════════════════════════════════════════════
    // UI 控制與遊戲面板操作邏輯
    // ═══════════════════════════════════════════════
    function openCountryInfo(c, clientX, clientY) {
      const panel = document.getElementById('country-info');
      document.getElementById('ci-name').textContent = c.name;
      
      let cleanTotal = (c.solar || 0) + (c.wind || 0) + (c.nuclear || 0);
      document.getElementById('ci-details').innerHTML = `
        <div class="flex justify-between"><span class="text-slate-400">產業定位:</span><span class="text-emerald-300 font-medium">${c.economy}</span></div>
        <div class="h-px bg-emerald-500/10 my-1.5"></div>
        <div class="space-y-1">
          <div class="flex justify-between"><span>☀️ 太陽能 Solar</span><span>${c.solar}%</span></div>
          <div class="flex justify-between"><span>💨 風力發電 Wind</span><span>${c.wind}%</span></div>
          <div class="flex justify-between"><span>⚛️ 核能發電 Nuclear</span><span>${c.nuclear}%</span></div>
          <div class="flex justify-between text-slate-500"><span>🛢️ 石油產能 Oil</span><span>${c.oil}%</span></div>
          <div class="flex justify-between text-slate-500"><span>⚫ 燃煤發電 Coal</span><span>${c.coal}%</span></div>
        </div>
        <div class="h-px bg-emerald-500/10 my-1.5"></div>
        <div class="flex justify-between font-bold text-emerald-400"><span>清潔能源總比:</span><span>${cleanTotal}%</span></div>
      `;

      // 決定浮動面板在畫面上的放置位置
      let x = clientX + 15;
      let y = clientY + 15;
      if (x + 280 > window.innerWidth) x = window.innerWidth - 300;
      if (y + 220 > window.innerHeight) y = window.innerHeight - 240;
      
      panel.style.left = `${x}px`;
      panel.style.top = `${y}px`;
      panel.style.opacity = '1';
      panel.style.transform = 'translateY(0)';
    }

    function closeCountryInfo() {
      state.selectedCountry = null;
      const panel = document.getElementById('country-info');
      panel.style.opacity = '0';
      panel.style.transform = 'translateY(15px)';
    }

    // 投資綠能機制
    function investGreen() {
      if (!state.selectedCountry) return;
      if (state.funds < 200000) {
        pushLog('[警告] 資金不足，無法進行綠能轉型投資！');
        return;
      }
      state.funds -= 200000;
      let c = state.selectedCountry;
      
      // 隨機調配綠能增加，石化燃料減少
      let amt = Math.floor(Math.random() * 4) + 3; // 3~6%
      if (c.oil >= amt) { c.oil -= amt; c.solar += amt; }
      else if (c.coal >= amt) { c.coal -= amt; c.wind += amt; }
      
      pushLog(`[投資成功] 成功資助 ${c.name.split(' ')[0]} 轉型，綠能配比提升 ${amt}%！`);
      openCountryInfo(c, parseInt(document.getElementById('country-info').style.left), parseInt(document.getElementById('country-info').style.top));
      render();
    }

    // ═══════════════════════════════════════════════
    // 全球股票市場連動交易系統 (與真實 Azure API 串接)
    // ═══════════════════════════════════════════════
    const PROXIES = [
      '', // 優先直連
      'https://cors-anywhere.herokuapp.com/',
      'https://api.allorigins.win/raw?url='
    ];

    async function fetchDirect(url) {
      for (let p of PROXIES) {
        try {
          let fullUrl = p ? (p.startsWith('http') && p.includes('allorigins') ? p + encodeURIComponent(url) : p + url) : url;
          let res = await fetch(fullUrl, { signal: AbortSignal.timeout(4000) });
          if (res.ok) return await res.json();
        } catch(e) {}
      }
      throw new Error("All API pathways failed");
    }

    async function initAPIs() {
      document.getElementById('api-status').textContent = 'Fetching Live API...';
      try {
        for (let s of state.stocks) {
          let data;
          if (s.symbol.includes('.') || s.symbol.includes('CO')) {
            // 國際市場走跨國代碼路徑
            data = await fetchDirect(`/api/quote-intl?symbol=${s.symbol}`);
          } else {
            // 美股走 Finnhub 代理
            data = await fetchDirect(`/api/quote?symbol=${s.symbol}`);
          }
          if (data && typeof data.c === 'number') {
            s.price = data.c;
            s.chg = data.pc ? ((data.c - data.pc) / data.pc * 100) : 0;
          }
        }
        document.getElementById('api-status').textContent = 'LIVE DATA SYNCED';
        pushLog('[SYSTEM] 真實世界能源股市數據同步成功。');
      } catch (e) {
        document.getElementById('api-status').textContent = 'SIMULATED DATA';
        pushLog('[WEB] 偵測到本機開發或跨域封鎖，啟動離線高頻股市模擬。');
        // 離線模擬初次隨機波動
        state.stocks.forEach(s => {
          s.chg = (Math.random() * 8) - 4;
          s.price = Math.max(1, s.price * (1 + s.chg / 100));
        });
      }
      renderStockList();
    }

    function renderStockList() {
      const tbody = document.getElementById('stock-list');
      tbody.innerHTML = '';
      state.stocks.forEach((s, idx) => {
        let chgText = s.chg >= 0 ? `+${s.chg.toFixed(2)}%` : `${s.chg.toFixed(2)}%`;
        let chgClass = s.chg >= 0 ? 'text-emerald-400' : 'text-rose-400';
        let row = document.createElement('tr');
        row.className = 'hover:bg-emerald-500/5 transition-colors group border-b border-emerald-500/5';
        row.innerHTML = `
          <td class="py-2.5 font-bold text-slate-200">${s.symbol}<span class="block text-[10px] text-slate-500 font-normal group-hover:text-slate-400 transition-colors">${s.name}</span></td>
          <td class="py-2.5 font-bold">$${s.price.toFixed(2)}</td>
          <td class="py-2.5 font-medium ${chgClass}">${chgText}</td>
          <td class="py-2.5 text-right font-semibold text-slate-400">${s.owned}</td>
          <td class="py-2.5 text-right"><button onclick="openTradeModal(${idx})" class="bg-emerald-500/10 group-hover:bg-emerald-500/20 text-emerald-400 font-bold py-1 px-2.5 rounded border border-emerald-500/20 group-hover:border-emerald-500/40 text-[10px] tracking-wider transition-all">TRADE</button></td>
        `;
        tbody.appendChild(row);
      });
    }

    function openTradeModal(idx) {
      state.selectedStock = state.stocks[idx];
      let s = state.selectedStock;
      document.getElementById('modal-title').textContent = `${s.symbol} - ${s.name}`;
      document.getElementById('modal-price').textContent = `$${s.price.toFixed(2)}`;
      document.getElementById('modal-funds').textContent = `$${state.funds.toLocaleString()}`;
      document.getElementById('modal-owned').textContent = `${s.owned} 股 (均價: $${s.avgCost.toFixed(2)})`;
      
      const m = document.getElementById('trade-modal');
      m.classList.remove('opacity-0', 'pointer-events-none');
      m.children[0].classList.remove('scale-95');
    }

    function closeTradeModal() {
      const m = document.getElementById('trade-modal');
      m.classList.add('opacity-0', 'pointer-events-none');
      m.children[0].classList.add('scale-95');
    }

    function confirmBuy() {
      let qty = parseInt(document.getElementById('trade-qty').value);
      if (!qty || qty <= 0) return;
      let s = state.selectedStock;
      let cost = s.price * qty;
      if (state.funds < cost) {
        pushLog('[警告] 您的信貸資金不足以支付此筆股票買單！');
        return;
      }
      state.funds -= cost;
      let totalCost = (s.owned * s.avgCost) + cost;
      s.owned += qty;
      s.avgCost = totalCost / s.owned;
      pushLog(`[證券交易所] 成功買入 ${qty} 股 ${s.symbol}，成交價 $${s.price.toFixed(2)}。`);
      render();
      closeTradeModal();
    }

    function confirmSell() {
      let qty = parseInt(document.getElementById('trade-qty').value);
      if (!qty || qty <= 0) return;
      let s = state.selectedStock;
      if (s.owned < qty) {
        pushLog('[警告] 賣出失敗！持股庫存餘額不足。');
        return;
      }
      let gain = s.price * qty;
      state.funds += gain;
      s.owned -= qty;
      if (s.owned === 0) s.avgCost = 0;
      pushLog(`[證券交易所] 成功賣出 ${qty} 股 ${s.symbol}，獲取資金 $${gain.toFixed(2)}。`);
      render();
      closeTradeModal();
    }

    // ═══════════════════════════════════════════════
    // 回合結算與事件調度引擎
    // ═══════════════════════════════════════════════
    function nextTurn() {
      state.turn++;
      
      // 1. 每回合被動資產結算發放
      let cleanBonus = 0;
      state.countries.forEach(c => {
        let cleanRatio = (c.solar || 0) + (c.wind || 0) + (c.nuclear || 0);
        cleanBonus += cleanRatio * 1500; // 綠能占比折算被動資金
      });
      state.funds += 150000 + cleanBonus; // 基本金 + 綠能分紅

      // 2. 股市波動模擬 (在不重打 API 的回合內走隨機行走)
      state.stocks.forEach(s => {
        let changePercent = (Math.random() * 16 - 8) / 100; // -8% ~ +8%
        s.price = Math.max(1, s.price * (1 + changePercent));
        s.chg = changePercent * 100;
      });

      // 3. 隨機地緣政治與環境事件事件
      triggerRandomEvent();

      pushLog(`--- [第 ${state.turn} 回合宣告結束，進入全新局勢] ---`);
      pushLog(`[財務結算] 收到基本稅收與綠能資產紅利：+$${(150000 + cleanBonus).toLocaleString()}`);
      
      saveGame(); // 自動儲存進度
      render();
    }

    function triggerRandomEvent() {
      const events = [
        { msg: '🔥 [極端氣候] 全球多國遭遇史詩級熱浪，各國電網負載逼近崩潰臨界點！', effect: () => {} },
        { msg: '🛢️ [地緣政治] 中東局勢再度緊繃，國際原油期貨單日暴漲 7%！', effect: () => {
          let oil = state.stocks.find(s => s.symbol === 'XOM');
          if (oil) { oil.price *= 1.12; oil.chg = 12; }
        }},
        { msg: '💨 [氣象報告] 北海風力全面停滯，部分歐洲綠能產權產能遭遇重挫。', effect: () => {
          let oer = state.stocks.find(s => s.symbol === 'ORSTED.CO');
          if (oer) { oer.price *= 0.88; oer.chg = -12; }
        }},
        { msg: '📜 [政策變更] 歐盟全面提高碳關稅限制，跨國石化重工遭到全面追稅。', effect: () => {} }
      ];
      if (Math.random() > 0.4) {
        let ev = events[Math.floor(Math.random() * events.length)];
        pushLog(ev.msg);
        ev.effect();
      }
    }

    function pushLog(text) {
      state.log.unshift(text);
      if (state.log.length > 50) state.log.pop();
      
      const container = document.getElementById('log-content');
      container.innerHTML = state.log.map(l => {
        let color = 'text-slate-400';
        if (l.includes('[警告]')) color = 'text-rose-400 font-semibold';
        if (l.includes('[投資成功]') || l.includes('成功買入')) color = 'text-emerald-400';
        if (l.includes('---')) color = 'text-cyan-400 font-bold border-y border-cyan-500/10 py-0.5 block';
        return `<div class="${color}">${l}</div>`;
      }).join('');
    }

    function render() {
      document.getElementById('stat-turn').textContent = state.turn;
      document.getElementById('stat-funds').textContent = `$${Math.floor(state.funds).toLocaleString()}`;
      
      // 計算全球平均清潔能源占比
      let totalClean = 0;
      state.countries.forEach(c => { totalClean += (c.solar || 0) + (c.wind || 0) + (c.nuclear || 0); });
      let avgClean = Math.round(totalClean / state.countries.length);
      document.getElementById('stat-clean').textContent = `${avgClean}%`;

      renderStockList();
    }

    // 本地持久化儲存進度 (Cookie/LocalStorage 防禦)
    function saveGame() {
      try { localStorage.setItem('ee_save', JSON.stringify({ turn: state.turn, funds: state.funds, stocks: state.stocks, countries: state.countries })); } catch(e){}
    }

    function loadGame() {
      try {
        let raw = localStorage.getItem('ee_save');
        if (raw) {
          let parsed = JSON.parse(raw);
          state.turn = parsed.turn || 1;
          state.funds = parsed.funds || 1000000;
          if (parsed.stocks) state.stocks = parsed.stocks;
          if (parsed.countries) state.countries = parsed.countries;
          pushLog(`[SYSTEM] 已自動讀取上一存檔，歷史進度成功銜接。`);
        }
      } catch(e){}
    }

    // ═══════════════════════════════════════════════
    // 背景音樂：雙首鋼琴音樂輪播控制系統 (BGM1 & BGM2)
    // ═══════════════════════════════════════════════
    (function () {
      let ctx, gain, started = false, on = false;
      let currentTrack = 1; // 追蹤目前正在輪播哪一首音軌
      const VOLUME = 1.0;   // 基礎音量大小

      // 初始化 Web Audio 音訊管道
      function build() {
        if (started) return;
        started = true;
        
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        gain = ctx.createGain();
        gain.gain.value = VOLUME;
        gain.connect(ctx.destination);

        const audio1 = document.getElementById('bgm1');
        const audio2 = document.getElementById('bgm2');

        // 將兩個 HTML 標籤音源線接入同一個控制器
        const src1 = ctx.createMediaElementSource(audio1);
        src1.connect(gain);
        const src2 = ctx.createMediaElementSource(audio2);
        src2.connect(gain);

        // 監聽 BGM1 播放結束事件，自動無縫呼叫 BGM2
        audio1.addEventListener('ended', () => {
          console.log("BGM1 播放完畢，為您切換至第二首抒情鋼琴曲...");
          currentTrack = 2;
          if (on) audio2.play().catch(e => console.log("音樂阻擋防禦:", e));
        });

        // 監聽 BGM2 播放結束事件，自動循環滾回 BGM1
        audio2.addEventListener('ended', () => {
          console.log("BGM2 播放完畢，重新循環回到首支鋼琴旋律...");
          currentTrack = 1;
          if (on) audio1.play().catch(e => console.log("音樂阻擋防禦:", e));
        });
      }

      // 控制面板右下角音樂圖示的點擊事件
      window.toggleMusic = function (btn) {
        const audio1 = document.getElementById('bgm1');
        const audio2 = document.getElementById('bgm2');
        
        if (!started) build();

        // 解鎖瀏覽器安全政策
        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        if (!on) {
          on = true;
          btn.innerHTML = `<i data-lucide="volume-2" class="w-4 h-4 text-emerald-400 animate-pulse"></i>`;
          
          // 點擊開啟時，根據目前時空進度決定播放哪一軌
          if (currentTrack === 1) {
            audio1.play().catch(e => console.log(e));
          } else {
            audio2.play().catch(e => console.log(e));
          }
        } else {
          on = false;
          btn.innerHTML = `<i data-lucide="volume-x" class="w-4 h-4 text-slate-400"></i>`;
          // 雙軌齊推暫停，確保聲音能立刻斷乾淨
          audio1.pause();
          audio2.pause();
        }
        lucide.createIcons();
      };
    })();

    // 啟動點
    loadGame();
    render();
    drawGlobe();
    lucide.createIcons();
    initAPIs();
  </script>
</body>
